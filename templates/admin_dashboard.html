<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Submitted Interactions</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; }

        header {
            background: linear-gradient(135deg, #234e52, #2c7a7b);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 20px; font-weight: 700; }
        .logout-link { color: white; font-size: 13px; text-decoration: none; background: rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 6px; }
        .logout-link:hover { background: rgba(255,255,255,0.25); }

        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }

        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #2c7a7b; }
        .card h3 { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .card .value { font-size: 26px; font-weight: 700; }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .chart-card h2 { font-size: 15px; margin-bottom: 16px; }
        .chart-container { position: relative; height: 250px; }

        .table-section { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .table-header h2 { font-size: 16px; }

        .export-btn {
            background: #2f855a;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .export-btn:hover { background: #276749; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f7fafc; padding: 10px; text-align: left; font-size: 11px; color: #666; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 10px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        tr:hover { background: #f7fafc; }
        .notes-cell { max-width: 220px; font-size: 12px; color: #555; }

        .severity-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .severity-badge.Major { background: #fed7d7; color: #c53030; }
        .severity-badge.Moderate { background: #feebc8; color: #c05621; }
        .severity-badge.Minor { background: #fefcbf; color: #975a16; }

        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .status-badge.pending { background: #edf2f7; color: #4a5568; }
        .status-badge.approved { background: #c6f6d5; color: #276749; }
        .status-badge.rejected { background: #fed7d7; color: #c53030; }
        .review-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .review-btn { padding: 5px 10px; border-radius: 5px; border: 1px solid #cbd5e0; background: white; font-size: 12px; font-weight: 600; cursor: pointer; }
        .review-btn.approve { border-color: #2f855a; color: #276749; }
        .review-btn.reject { border-color: #c53030; color: #c53030; }
        .review-btn:hover { background: #f7fafc; }
        .review-btn:disabled { opacity: 0.5; cursor: default; }
        .table-note { font-size: 12px; color: #666; margin-bottom: 14px; line-height: 1.5; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .filter-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #cbd5e0; background: white; font-size: 12px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: #234e52; color: white; border-color: #234e52; }
        .detail-line { margin-top: 4px; }

        .loading { text-align: center; padding: 30px; color: #888; }
    </style>
</head>
<body>

<header>
    <h1>Submitted Drug Interactions - Admin</h1>
    <a href="/admin/logout" class="logout-link">Log Out</a>
</header>

<div class="container">

    <div class="summary-cards" id="summary-cards">
        <div class="loading">Loading...</div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h2>Submissions by Severity</h2>
            <div class="chart-container"><canvas id="severityChart"></canvas></div>
        </div>
        <div class="chart-card">
            <h2>Submitters by Profession</h2>
            <div class="chart-container"><canvas id="professionChart"></canvas></div>
        </div>
    </div>

    <div class="table-section">
        <div class="table-header">
            <h2>All Submitted Interactions</h2>
            <a href="/api/admin/export-csv" class="export-btn">Export CSV</a>
        </div>
        <p class="table-note" id="review-note"></p>
        <div class="filter-row" id="filter-row"></div>
        <table>
            <thead>
                <tr>
                    <th>Date</th><th>Drug 1</th><th>Drug 2</th><th>Severity</th>
                    <th>Submitter</th><th>Profession</th><th>Details</th><th>Review</th>
                </tr>
            </thead>
            <tbody id="submissions-body">
                <tr><td colspan="8" class="loading">Loading submissions...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const colors = ['#2c7a7b', '#c53030', '#d69e2e', '#805ad5', '#2f855a', '#dd6b20'];

    async function loadSummary() {
        const res = await fetch('/api/admin/summary');
        const d = await res.json();

        document.getElementById('summary-cards').innerHTML = summaryCards(d);
        document.getElementById('review-note').textContent = d.pending_visible
            ? 'Pending submissions show in the public checker marked "not independently verified". Approving marks one as reviewed by an administrator. Rejecting hides it from the public checker.'
            : 'Pending submissions are hidden from the public checker until approved. Rejecting keeps one hidden.';

        new Chart(document.getElementById('severityChart'), {
            type: 'doughnut',
            data: {
                labels: d.by_severity.map(s => s.severity),
                datasets: [{ data: d.by_severity.map(s => s.count), backgroundColor: ['#c53030', '#dd6b20', '#d69e2e'], borderWidth: 2, borderColor: '#fff' }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        new Chart(document.getElementById('professionChart'), {
            type: 'bar',
            data: {
                labels: d.by_profession.map(p => p.profession),
                datasets: [{ label: 'Submitters', data: d.by_profession.map(p => p.count), backgroundColor: colors, borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const STATUS_LABELS = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
    let submissions = [];
    let statusFilter = 'all';

    async function loadSubmissions() {
        const res = await fetch('/api/admin/submitted-interactions');
        submissions = await res.json();
        renderSubmissions();
    }

    function renderSubmissions() {
        const counts = { all: submissions.length, pending: 0, approved: 0, rejected: 0 };
        submissions.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });

        const filters = document.getElementById('filter-row');
        filters.innerHTML = '';
        [['all', 'All'], ['pending', 'Pending'], ['approved', 'Approved'], ['rejected', 'Rejected']].forEach(([key, label]) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'filter-btn' + (statusFilter === key ? ' active' : '');
            button.textContent = `${label} (${counts[key]})`;
            button.addEventListener('click', () => { statusFilter = key; renderSubmissions(); });
            filters.appendChild(button);
        });

        const body = document.getElementById('submissions-body');
        const shown = submissions.filter(s => statusFilter === 'all' || s.status === statusFilter);
        if (!shown.length) {
            body.innerHTML = `<tr><td colspan="8">${submissions.length ? 'No submissions with this status.' : 'No submissions yet.'}</td></tr>`;
            return;
        }

        body.innerHTML = shown.map(s => `
            <tr>
                <td>${escapeHtml(String(s.submitted_at).split(' ')[0])}</td>
                <td>${escapeHtml(s.drug1_name)}</td>
                <td>${escapeHtml(s.drug2_name)}</td>
                <td><span class="severity-badge ${escapeHtml(s.severity)}">${escapeHtml(s.severity)}</span></td>
                <td>${escapeHtml(s.submitter_name)}<br><span style="color:#888;font-size:11px;">${escapeHtml(s.submitter_email)}</span></td>
                <td>${escapeHtml(s.profession || '-')}</td>
                <td class="notes-cell">
                    ${escapeHtml(s.description)}
                    ${s.clinical_effects ? `<div class="detail-line"><strong>Effects:</strong> ${escapeHtml(s.clinical_effects)}</div>` : ''}
                    ${s.management ? `<div class="detail-line"><strong>Management:</strong> ${escapeHtml(s.management)}</div>` : ''}
                </td>
                <td>
                    <span class="status-badge ${escapeHtml(s.status)}">${escapeHtml(STATUS_LABELS[s.status] || s.status)}</span>
                    <div class="review-actions">
                        ${s.status !== 'approved' ? `<button type="button" class="review-btn approve" data-id="${s.id}" data-status="approved">Approve</button>` : ''}
                        ${s.status !== 'rejected' ? `<button type="button" class="review-btn reject" data-id="${s.id}" data-status="rejected">Reject</button>` : ''}
                        ${s.status !== 'pending' ? `<button type="button" class="review-btn" data-id="${s.id}" data-status="pending">Undo</button>` : ''}
                    </div>
                </td>
            </tr>
        `).join('');

        body.querySelectorAll('.review-btn').forEach(button => {
            button.addEventListener('click', () => reviewSubmission(Number(button.dataset.id), button.dataset.status, button));
        });
    }

    async function reviewSubmission(id, status, button) {
        button.disabled = true;
        let data;
        try {
            const res = await fetch(`/api/admin/submitted-interactions/${id}/review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            data = await res.json();
        } catch (err) {
            data = { error: 'Could not reach the server.' };
        }
        if (data.error) {
            button.disabled = false;
            button.textContent = data.error === 'Unauthorized' ? 'Log in again' : 'Failed, try again';
            return;
        }
        const submission = submissions.find(s => s.id === id);
        if (submission) submission.status = status;
        renderSubmissions();
        loadReviewCards();
    }

    // Status cards and the note explaining what each status does publicly.
    async function loadReviewCards() {
        const res = await fetch('/api/admin/summary');
        const d = await res.json();
        document.getElementById('summary-cards').innerHTML = summaryCards(d);
        document.getElementById('review-note').textContent = d.pending_visible
            ? 'Pending submissions show in the public checker marked "not independently verified". Approving marks one as reviewed by an administrator. Rejecting hides it from the public checker.'
            : 'Pending submissions are hidden from the public checker until approved. Rejecting keeps one hidden.';
    }

    function summaryCards(d) {
        return `
            <div class="card"><h3>Total Submitted</h3><div class="value">${d.total_submitted}</div></div>
            <div class="card"><h3>Waiting for Review</h3><div class="value">${d.by_status.pending}</div></div>
            <div class="card"><h3>Approved</h3><div class="value">${d.by_status.approved}</div></div>
            <div class="card"><h3>Rejected</h3><div class="value">${d.by_status.rejected}</div></div>
            <div class="card"><h3>Unique Submitters</h3><div class="value">${d.total_submitters}</div></div>
        `;
    }

    loadSummary();
    loadSubmissions();
</script>

</body>
</html>
